spring.application.name=scheduling-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/bompradev_scheduling}
spring.datasource.username=${DATABASE_USER:bompradev}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=optional:consul:

management.endpoints.web.exposure.include=health,info
